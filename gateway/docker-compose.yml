services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    environment:
      LST_OLLAMA_BASE_URL: http://ollama:11434
      LST_OLLAMA_MODEL: hy-mt:1.5b
      LST_MODEL_MODE: generate
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  ollama-data:
